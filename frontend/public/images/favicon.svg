  <path d="M 120 370 C 160 330 200 300 245 290 C 275 282 290 285 305 275 C 315 268 318 258 310 252 C 302 245 285 255 255 265 C 230 273 195 295 165 330 C 150 348 135 365 120 370 Z" fill="#e0c088"/>
  <path d="M 140 395 C 190 355 250 335 305 325 C 340 318 375 300 385 275 C 388 268 382 260 372 265 C 352 276 325 300 285 315 C 240 330 185 360 140 395 Z" fill="#d27854"/>
  <path d="M 170 420 C 220 380 290 355 350 340 C 385 330 415 305 422 285 C 424 278 416 272 408 278 C 385 295 355 320 315 335 C 265 355 210 388 170 420 Z" fill="#e0c088"/>
</svg>