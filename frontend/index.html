<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163428" />
    <meta name="description" content="TrueHand - Handmade with Intention" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "tertiary": "#2f2f2c",
              "outline": "#727974",
              "on-error-container": "#93000a",
              "on-surface-variant": "#424844",
              "outline-variant": "#c1c8c3",
              "surface-tint": "#466557",
              "background": "#fcf9f8",
              "surface-bright": "#fcf9f8",
              "on-tertiary-fixed": "#1c1c19",
              "surface": "#fcf9f8",
              "surface-container-highest": "#e4e2e1",
              "primary-fixed": "#c8ead8",
              "on-primary-container": "#99baa9",
              "on-error": "#ffffff",
              "error": "#ba1a1a",
              "on-secondary-fixed": "#390c00",
              "on-background": "#1b1c1c",
              "primary-fixed-dim": "#adcebd",
              "on-secondary-fixed-variant": "#793015",
              "surface-container": "#f0eded",
              "surface-variant": "#e4e2e1",
              "secondary-container": "#ff9875",
              "on-primary-fixed": "#012116",
              "tertiary-fixed": "#e5e2de",
              "on-secondary": "#ffffff",
              "surface-dim": "#dcd9d9",
              "inverse-on-surface": "#f3f0ef",
              "primary-container": "#2d4b3e",
              "tertiary-fixed-dim": "#c8c6c2",
              "on-surface": "#1b1c1c",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#464542",
              "on-tertiary-container": "#b5b2af",
              "secondary": "#97472a",
              "surface-container-low": "#f6f3f2",
              "error-container": "#ffdad6",
              "secondary-fixed": "#ffdbd0",
              "on-primary": "#ffffff",
              "on-tertiary-fixed-variant": "#474744",
              "inverse-surface": "#303030",
              "surface-container-high": "#eae7e7",
              "inverse-primary": "#adcebd",
              "on-secondary-container": "#772f14",
              "primary": "#163428",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed-variant": "#2f4d40",
              "secondary-fixed-dim": "#ffb59c"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            "spacing": {
              "unit": "4px",
              "stack-lg": "32px",
              "gutter": "24px",
              "container-max": "1280px",
              "stack-sm": "8px",
              "margin-desktop": "40px",
              "stack-md": "16px",
              "margin-mobile": "16px",
              "section-gap": "80px"
            },
            "fontFamily": {
              "body-md": ["Hanken Grotesk"],
              "display-lg": ["EB Garamond"],
              "label-sm": ["Hanken Grotesk"],
              "label-md": ["Hanken Grotesk"],
              "headline-md": ["EB Garamond"],
              "headline-lg-mobile": ["EB Garamond"],
              "body-lg": ["Hanken Grotesk"],
              "headline-lg": ["EB Garamond"]
            },
            "fontSize": {
              "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
              "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "500" }],
              "label-sm": ["12px", { "lineHeight": "1.4", "fontWeight": "500" }],
              "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600" }],
              "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
              "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "500" }],
              "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
              "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "500" }]
            }
          }
        }
      }
    </script>
    <title>TrueHand</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
