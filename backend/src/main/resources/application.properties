# Application Configuration
# Local .env loading is opt-in through the local profile; production uses environment variables.
spring.application.name=truehand-api
server.port=${PORT:8080}

# Database Configuration (Neon Cloud DB / PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/truehand}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

server.forward-headers-strategy=framework
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging
logging.level.root=INFO
logging.level.com.truehand=INFO

# Stripe Configuration
# Replace with your actual Stripe Secret Key (sk_test_...)
stripe.api.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${MAIL_FROM:no-reply@truehand.com}

# Frontend base URL used in email links
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# CORS configuration for deployed frontend origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Provider outages are retried through the outbox; avoid SMTP authentication on every probe.
management.health.mail.enabled=${MAIL_HEALTH_CHECK_ENABLED:false}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

data.encryption.key=${DATA_ENCRYPTION_KEY:}

spring.data.web.pageable.max-page-size=100
notifications.dispatch.enabled=${NOTIFICATION_DISPATCH_ENABLED:false}
notifications.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notifications.push.enabled=${NOTIFICATION_PUSH_ENABLED:false}
notifications.expo.access-token=${EXPO_ACCESS_TOKEN:}
api.rate-limit.enabled=true
api.rate-limit.requests-per-minute=${API_REQUESTS_PER_MINUTE:300}
api.rate-limit.media-per-minute=${MEDIA_REQUESTS_PER_MINUTE:20}
api.rate-limit.payments-per-minute=${PAYMENT_REQUESTS_PER_MINUTE:30}
