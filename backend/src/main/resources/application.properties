# Application Configuration
spring.application.name=truehand-api
server.port=8080

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/truehand}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your_secret_key_here_min_32_characters_long
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.truehand=DEBUG

# Stripe Configuration
# Replace with your actual Stripe Secret Key (sk_test_...)
stripe.api.key=sk_test_placeholder
